<line x1='378.92' y1='470.62' x2='392.74' y2='470.62' style='stroke-width: 1.92; stroke: #087F8C; stroke-linecap: butt;' />
<text x='400.45' y='474.20' style='font-size: 10.00px; font-family: "Arial";' textLength='117.84px' lengthAdjust='spacingAndGlyphs'>Fixed age-cost benchmark</text>
<text x='15.94' y='48.13' style='font-size: 12.00px; font-family: "Arial";' textLength='432.80px' lengthAdjust='spacingAndGlyphs'>Population age mix changes; every age-specific cost and service mix is held fixed</text>
<text x='15.94' y='29.55' style='font-size: 19.00px; font-weight: bold; font-family: "Arial";' textLength='521.55px' lengthAdjust='spacingAndGlyphs'>What would ageing alone do at fixed health costs by age?</text>
<text x='15.94' y='520.91' style='font-size: 9.00px; font-family: "Arial";' textLength='532.02px' lengthAdjust='spacingAndGlyphs'>Fixed-profile counterfactual: Treasury population is calibrated to HLFS/forecast totals, not the raw Stats NZ resident-population series.</text>
<text x='15.94' y='533.33' style='font-size: 9.00px; font-family: "Arial";' textLength='573.23px' lengthAdjust='spacingAndGlyphs'>Ages 15-64 are not a count of workers or taxpayers. A demographic-demand benchmark, not actual spending or Treasury's full health model. No</text>
<text x='15.94' y='545.75' style='font-size: 9.00px; font-family: "Arial";' textLength='312.83px' lengthAdjust='spacingAndGlyphs'>changes in health, technology, prices or proximity-to-death costs are modelled.</text>
<text x='15.94' y='558.17' style='font-size: 9.00px; font-family: "Arial";' textLength='593.53px' lengthAdjust='spacingAndGlyphs'>Sources: Treasury LTFS 2025 official figure data; LTFM and OLG identified separately; Treasury 2025 Long-Term Fiscal Model, based on BEFU 2025</text>
