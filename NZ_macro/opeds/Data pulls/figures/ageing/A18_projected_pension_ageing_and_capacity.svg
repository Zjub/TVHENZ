<text x='288.35' y='486.62' style='font-size: 10.00px; font-family: "Arial";' textLength='115.94px' lengthAdjust='spacingAndGlyphs'>65+ relative to ages 15-64</text>
<text x='474.11' y='486.62' style='font-size: 10.00px; font-family: "Arial";' textLength='148.81px' lengthAdjust='spacingAndGlyphs'>Real GDP per person aged 15-64</text>
<text x='288.35' y='509.88' style='font-size: 10.00px; font-family: "Arial";' textLength='156.53px' lengthAdjust='spacingAndGlyphs'>Real expense per person aged 65+</text>
<text x='15.94' y='48.13' style='font-size: 12.00px; font-family: "Arial";' textLength='448.98px' lengthAdjust='spacingAndGlyphs'>Exact identity: NZS/GDP = (65+ / 15-64) × (real NZS per 65+) / (real GDP per 15-64)</text>
<text x='15.94' y='29.55' style='font-size: 19.00px; font-weight: bold; font-family: "Arial";' textLength='574.36px' lengthAdjust='spacingAndGlyphs'>Age pressure and economic capacity pull in different directions</text>
<text x='15.94' y='533.33' style='font-size: 9.00px; font-family: "Arial";' textLength='560.17px' lengthAdjust='spacingAndGlyphs'>Projection accounting decomposition: Log-mean allocation; real means CPI-deflated in this identity. GDP per person aged 15-64 is not labour</text>
<text x='15.94' y='545.75' style='font-size: 9.00px; font-family: "Arial";' textLength='380.92px' lengthAdjust='spacingAndGlyphs'>productivity. Per-65+ expense also includes coverage and mix. Baseline GDP held as modelled.</text>
<text x='15.94' y='558.17' style='font-size: 9.00px; font-family: "Arial";' textLength='285.02px' lengthAdjust='spacingAndGlyphs'>Sources: Treasury 2025 Long-Term Fiscal Model, based on BEFU 2025</text>
